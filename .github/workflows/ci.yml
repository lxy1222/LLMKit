name: CI

# 目标运行时是 Windows 自带的 PowerShell 5.1（Windows 10/11 上一定有），
# 所以这里刻意用 `shell: powershell` 而不是 runner 默认的 pwsh ——
# 用 7.x 跑绿了不代表 5.1 能跑，而用户手上就是 5.1。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: powershell

jobs:
  verify:
    name: 自检 / 冒烟 / 打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 显示运行时版本
        run: |
          Write-Host ('PowerShell ' + $PSVersionTable.PSVersion.ToString())
          node --version

      - name: 脚本必须是 UTF-8 with BOM，且语法能过
        run: |
          # PS 5.1 读无 BOM 的 UTF-8 会按 ANSI 解码，中文全成乱码、语法都过不了。
          # 这条不靠人记，交给 CI 钉住（历史上踩过四次）。
          $bad = 0
          $files = @(Get-ChildItem src, tests, build -Recurse -Include *.ps1, *.psm1 | Sort-Object FullName)
          foreach ($f in $files) {
            $bx = [System.IO.File]::ReadAllBytes($f.FullName)
            $bom = ($bx.Length -ge 3 -and $bx[0] -eq 0xEF -and $bx[1] -eq 0xBB -and $bx[2] -eq 0xBF)
            $tk = $null; $er = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tk, [ref]$er)
            if (-not $bom) { Write-Host ('缺少 BOM：' + $f.FullName); $bad++ }
            if ($er.Count -gt 0) {
              Write-Host ('语法错误：' + $f.FullName)
              $er | Select-Object -First 3 | ForEach-Object { Write-Host ('  L' + $_.Extent.StartLineNumber + ': ' + $_.Message) }
              $bad++
            }
          }
          Write-Host ($files.Count.ToString() + ' 个脚本检查完毕')
          if ($bad -gt 0) { throw ($bad.ToString() + ' 个脚本不合格') }

      - name: 泄露扫描（本机路径 / key / 诊断报告）
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests\Test-NoLeak.ps1
      - name: 单元测试
        run: .\tests\Test-LLMKit.ps1


      - name: 网页版自检
        run: .\src\ps\Start-LLMKitWeb.ps1 -SelfTest

      - name: 打包两条分支（绿色包 + 单文件 .cmd）
        run: |
          # 桌面版已删除，现在只出两种产物，都打开浏览器版
          .\build\Build-Release.ps1 -Tier green -NoColor
          if ($LASTEXITCODE -ne 0) { throw 'green 分支打包失败' }
          .\build\Build-Release.ps1 -Tier single -NoColor
          if ($LASTEXITCODE -ne 0) { throw 'single 分支打包失败' }

      - name: 载荷内容自证（从单文件 .cmd 里解出 zip 再核对）
        run: |
          # 桌面版那条 exe 分支删掉之后，没有现成的 _payload.zip 可查了，
          # 于是直接从单文件 .cmd 的 base64 段解出来验 —— 校验的正是用户手上那份载荷。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $single = @(Get-ChildItem 'build\dist\LLMKit-web-single-*.cmd' | Sort-Object LastWriteTime -Descending)[0]
          $lines = [System.IO.File]::ReadAllLines($single.FullName, [System.Text.Encoding]::UTF8)
          $marker = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].Trim() -eq ':LLMKIT-PAYLOAD') { $marker = $i; break } }
          if ($marker -lt 0) { throw '单文件里找不到载荷标记' }
          $b64 = ($lines[($marker + 1)..($lines.Count - 1)] -join '').Trim()
          $zip = Join-Path $env:RUNNER_TEMP 'llmkit-payload.zip'
          [System.IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $arch = [System.IO.Compression.ZipFile]::OpenRead($zip)
          $names = @($arch.Entries | ForEach-Object { $_.FullName })
          $arch.Dispose()
          # 反斜杠条目名不符合 zip 规范，严格的解压器会解出名字里带反斜杠的怪文件
          $backslash = @($names | Where-Object { $_.Contains('\') })
          if ($backslash.Count -gt 0) { throw ('载荷里有 ' + $backslash.Count + ' 个反斜杠条目名') }
          foreach ($need in @('web/index.html', 'web/assets/app.js', 'web/assets/app.css', 'src/ps/LLMKit.Web.psm1', 'src/ps/LLMKit.Engine.psm1', 'config/tools.json')) {
            if ($names -notcontains $need) { throw ('载荷缺少：' + $need) }
          }
          Write-Host ('载荷 ' + $names.Count + ' 个文件，关键文件齐全')

      - name: 搬移与还原（隔离环境里真跑，不碰 runner 上的真实目录）
        run: .\tests\Test-UninstallCycle.ps1

      - name: 工具检测（启动器折叠 vs 真冲突，只用临时目录）
        run: .\tests\Test-ToolDetection.ps1

      - name: 启动命令（六个工具各自拼装什么，含起进程机制）
        run: .\tests\Test-LaunchSpec.ps1

      - name: 环境同步（该补的补、改过的不动；只碰当前进程）
        run: .\tests\Test-EnvSync.ps1

      - name: 前端冒烟测试（仓库源码）
        run: .\tests\Invoke-WebSmoke.ps1

      - name: 前端冒烟测试（绿色包里的那一份）
        run: .\tests\Invoke-WebSmoke.ps1 -WebRoot .\build\dist\LLMKit

      - name: 单文件 .cmd 释放后自检 + 冒烟
        run: |
          # 单文件 .cmd 现在是「唯一」的便携形态：解压到临时目录、传 -SelfTest 给网页版入口。
          # 用 cmd 启动（而不是 Start-Process 直接跑 .cmd），这样 %ERRORLEVEL% 才是真退出码。
          $env:LLMKIT_HOME = Join-Path $env:RUNNER_TEMP 'llmkit-single'
          $env:LLMKIT_NO_PAUSE = '1'
          $single = @(Get-ChildItem 'build\dist\LLMKit-web-single-*.cmd' | Sort-Object LastWriteTime -Descending)[0]
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', $single.FullName, '-SelfTest' -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw '单文件自检超时' }
          if ($p.ExitCode -ne 0) { throw ('单文件自检失败，退出码 ' + $p.ExitCode) }
          Write-Host ('自检通过，用时 ' + [int]$sw.Elapsed.TotalSeconds + 's')
          $dest = @(Get-ChildItem (Join-Path $env:LLMKIT_HOME 'portable') -Directory)[0].FullName
          Write-Host ('释放到 ' + $dest)
          .\tests\Invoke-WebSmoke.ps1 -WebRoot $dest

      - name: 单文件 .cmd 起服务后能正常开着并关闭
        run: |
          $env:LLMKIT_HOME = Join-Path $env:RUNNER_TEMP 'llmkit-single-web'
          $env:LLMKIT_NO_PAUSE = '1'
          $single = @(Get-ChildItem 'build\dist\LLMKit-web-single-*.cmd' | Sort-Object LastWriteTime -Descending)[0]
          $port = 18471
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', $single.FullName, '-NoBrowser', '-Port', $port -PassThru
          $base = 'http://127.0.0.1:' + $port
          $ready = $false
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Milliseconds 500
            try { Invoke-WebRequest -Uri ($base + '/api/health') -UseBasicParsing -TimeoutSec 3 | Out-Null; $ready = $true; break } catch { }
          }
          if (-not $ready) { $p.Kill(); throw '单文件 .cmd 没能把服务起起来' }
          $page = Invoke-WebRequest -Uri $base -UseBasicParsing -TimeoutSec 10
          if ($page.Content -notmatch '/assets/app\.js') { $p.Kill(); throw '首页没有引用前端脚本' }
          $dest = @(Get-ChildItem (Join-Path $env:LLMKIT_HOME 'portable') -Directory)[0].FullName
          node .\tests\web-dom-smoke.js $base (Join-Path $dest 'web\assets\app.js')
          if ($LASTEXITCODE -ne 0) { $p.Kill(); throw '单文件 .cmd 的冒烟测试失败' }
          Invoke-WebRequest -Uri ($base + '/api/shutdown') -Method POST -UseBasicParsing -TimeoutSec 5 | Out-Null
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw '关闭服务后单文件进程没有自行退出' }
          Write-Host ('进程已自行退出，退出码 ' + $p.ExitCode)
      - name: 演练跑一遍，确认真实配置文件没被动过
        run: |
          $watched = @(
            (Join-Path $env:USERPROFILE '.claude\settings.json'),
            (Join-Path $env:USERPROFILE '.claude.json'),
            (Join-Path $env:USERPROFILE '.cc-switch\settings.json')
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $before = @{}
          foreach ($f in $watched) { $before[$f] = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash }
          $pathBefore = (Get-ItemProperty 'HKCU:\Environment' -Name Path).Path

          .\src\ps\Setup-LLMKit.ps1 -SkipCheck -IncludeTools -Uninstall opencode -NoColor

          foreach ($f in $watched) {
            if ($before[$f] -ne (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash) { throw ('演练却改动了：' + $f) }
          }
          if ($pathBefore -ne (Get-ItemProperty 'HKCU:\Environment' -Name Path).Path) { throw '演练却改动了用户 PATH' }
          Write-Host '演练零副作用确认通过'
